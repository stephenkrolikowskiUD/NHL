name: NHL Grader

on:
  # OFF-SEASON 2026-07-30: scheduled runs removed; manual-only until next season.
  # No games to grade out of season. Prior schedule is recoverable from git history.
  workflow_dispatch:

jobs:
  run-nhl-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pytz gspread google-auth

      - name: Run NHL grader
        run: python NHLGrader5-4.py
