name: NHL Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "30 22 * * *"

jobs:
  run-nhl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests pytz gspread google-auth google-genai

      - name: Run NHL engine
        run: python mlb_nhl_nba_fix/NHLEngine5-4.py
