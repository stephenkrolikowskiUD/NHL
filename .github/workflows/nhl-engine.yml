name: NHL Engine

on:
  # OFF-SEASON 2026-07-30: scheduled runs removed; manual-only until next season.
  # Out of season the engine finds no games, skips writing the empty "tonight" tabs
  # (leaving a stale slate on the dashboard), and still spends Odds API credits.
  # Prior schedule is recoverable from git history. Re-add a `schedule:` block at
  # season start.
  workflow_dispatch:

jobs:
  run-nhl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests pytz gspread google-auth google-genai

      - name: Run NHL engine
        run: python NHLEngine5-4.py
