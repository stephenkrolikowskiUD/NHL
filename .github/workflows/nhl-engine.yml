name: NHL Engine

on:
  schedule:
    - cron: "45 5 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  run-nhl-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NHL_AUDIT_DIR: nhl_accuracy_snapshots
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests pytz gspread google-auth google-genai

      - name: Run NHL engine
        run: python NHLEngine5-4.py

      - name: Save prediction audit inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhl-accuracy-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: nhl_accuracy_snapshots/
          retention-days: 90
          if-no-files-found: warn
